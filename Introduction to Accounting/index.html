<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Accounting Flashcards</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand-mark">A</div>
    <div><p class="eyebrow">STUDY DECK</p><h1>Basic Accounting</h1><p class="subtitle">Introduction to Accounting · Flashcards</p></div>
  </header>
  <div style="padding:14px 34px 0;text-align:right"><a href="quiz-menu.html" style="font-size:13px;font-weight:700;color:#3867f4;text-decoration:none">Take a quiz →</a></div>
  <section class="toolbar">
    <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search cards or answers…"></label>
    <select id="category" aria-label="Filter category"><option value="All">All topics</option></select>
  </section>
  <main>
    <div class="meta"><span id="topic">All topics</span><span id="counter">Card 1 of 1</span></div>
    <button id="card" class="flashcard" aria-label="Flashcard. Click to reveal answer">
      <span class="card-top"><span id="sideLabel">QUESTION</span><span class="flip-hint">↻ Click to flip</span></span>
      <span id="cardText" class="card-text"></span>
      <span class="card-bottom"><span id="tapHint">Think of the answer, then reveal</span><span class="spark">✦</span></span>
    </button>
    <div class="progress-track"><div id="progress" class="progress-fill"></div></div>
    <div class="controls">
      <button id="prev" class="btn secondary">← Previous</button>
      <button id="flip" class="btn primary">Reveal answer</button>
      <button id="next" class="btn secondary">Next →</button>
    </div>
    <div class="study-actions">
      <button id="shuffle" class="text-btn">⤨ Shuffle deck</button>
      <button id="restart" class="text-btn">↺ Restart</button>
    </div>
    <div class="keyboard">TIP: Use <kbd>←</kbd> <kbd>→</kbd> to navigate and <kbd>Space</kbd> to flip.</div>
  </main>
  <footer><span>Made for focused review</span><span id="countTotal"></span></footer>
</div>
<script src="script.js"></script>
</body></html>
